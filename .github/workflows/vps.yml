name: VPS integration
on:
  pull_request:
  push:
    branches: [main, integrate/beta-r26-easypanel]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:vps
      - run: docker build -t sambu-beta:test .
